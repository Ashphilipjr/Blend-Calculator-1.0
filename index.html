<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Alloy Blend & Charge Costing</title>
<meta name="theme-color" content="#14140F" />
<meta name="description" content="Inventory, yield-adjusted chemistry, and margin calculator for alloy blending." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #14140F; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; -webkit-tap-highlight-color: transparent; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { opacity: 0.4; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid #C4622D; outline-offset: 1px; }
  ::selection { background: #C4622D; color: #14140F; }
  #root { min-height: 100vh; }

  /* Mobile responsiveness */
  @media (max-width: 860px) {
    .main-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 520px) {
    .page-pad { padding: 12px !important; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
    .header-row { flex-direction: column; align-items: flex-start !important; }
    .header-controls { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState } = React;

// ---- Minimal inline icon set (stroke style, currentColor) ----
const Icon = ({ children, size = 16, color = "currentColor" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const CalculatorIcon = (p) => <Icon {...p}><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="18"/><line x1="8" y1="18" x2="8" y2="18"/><line x1="12" y1="18" x2="12" y2="18"/></Icon>;
const DollarIcon = (p) => <Icon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
const TrendingUpIcon = (p) => <Icon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>;
const PackageIcon = (p) => <Icon {...p}><path d="M21 8v8a2 2 0 0 1-1 1.73l-6 3.46a2 2 0 0 1-2 0l-6-3.46A2 2 0 0 1 3 16V8"/><path d="M3.27 6.96 12 12l8.73-5.04"/><line x1="12" y1="22" x2="12" y2="12"/></Icon>;
const CheckIcon = (p) => <Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>;
const AlertIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
const RefreshIcon = (p) => <Icon {...p}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></Icon>;
const LayersIcon = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></Icon>;
const PercentIcon = (p) => <Icon {...p}><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></Icon>;
const PlusIcon = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const ScaleIcon = (p) => <Icon {...p}><line x1="12" y1="3" x2="12" y2="21"/><path d="M5 8l-3 6a4 4 0 0 0 8 0z"/><path d="M19 8l-3 6a4 4 0 0 0 8 0z"/><path d="M8 3h8"/></Icon>;
const XIcon = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
const FileCheckIcon = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15l2 2 4-4"/></Icon>;
const ReceiptIcon = (p) => <Icon {...p}><path d="M4 2h16v20l-3-2-3 2-3-2-3 2-3-2-1 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/></Icon>;
const TrashIcon = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Icon>;

const ELEMENTS = ['Ni', 'Cr', 'Mo', 'Fe', 'Cu', 'C'];

const initialMaterials = [
  { id: 'mat-1', name: 'Inconel 625 Scrap', category: 'High Nickel', elements: { Ni: 58.0, Cr: 21.5, Mo: 9.0, Fe: 5.0, Cu: 0.2, C: 0.05 }, availableQtyKg: 5000, purchasePricePerKg: 14.5, yieldPercent: 96.0, selected: true, allocatedQtyKg: 3500 },
  { id: 'mat-2', name: 'SS 316 Scrap', category: 'Stainless Steel', elements: { Ni: 10.5, Cr: 16.5, Mo: 2.1, Fe: 69.5, Cu: 0.3, C: 0.03 }, availableQtyKg: 10000, purchasePricePerKg: 1.85, yieldPercent: 97.5, selected: true, allocatedQtyKg: 4000 },
  { id: 'mat-3', name: 'Pure Nickel Cathode', category: 'Pure Metals', elements: { Ni: 99.8, Cr: 0.0, Mo: 0.0, Fe: 0.1, Cu: 0.0, C: 0.01 }, availableQtyKg: 2000, purchasePricePerKg: 17.2, yieldPercent: 99.5, selected: true, allocatedQtyKg: 500 },
  { id: 'mat-4', name: 'Ferro-Molybdenum (70% Mo)', category: 'Ferroalloys', elements: { Ni: 0.0, Cr: 0.0, Mo: 70.0, Fe: 29.5, Cu: 0.0, C: 0.1 }, availableQtyKg: 1500, purchasePricePerKg: 28.0, yieldPercent: 95.0, selected: true, allocatedQtyKg: 200 },
];

const initialRequirement = {
  gradeName: 'High-Ni Superalloy Specification',
  targetWeightKg: 8000,
  targetSalesPricePerKg: 12.5,
  minSpecs: { Ni: 30.0, Cr: 14.0, Mo: 4.0, Fe: 0.0, Cu: 0.0, C: 0.0 },
  maxSpecs: { Ni: 42.0, Cr: 19.0, Mo: 6.5, Fe: 45.0, Cu: 0.8, C: 0.08 },
};

const emptyElements = { Ni: 0, Cr: 0, Mo: 0, Fe: 0, Cu: 0, C: 0 };
const STORAGE_KEY = 'alloy-costing-state-v1';

function fmt(n, opts = {}) {
  return Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2, ...opts });
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function App() {
  const saved = loadSaved();
  const [unit, setUnit] = useState(saved?.unit || 'MT');
  const [materials, setMaterials] = useState(saved?.materials || initialMaterials);
  const [target, setTarget] = useState(saved?.target || initialRequirement);
  const [expenses, setExpenses] = useState(saved?.expenses || {
    freightCostTotal: 450, clearanceCostTotal: 300, operationalCostTotal: 850, otherExpensesTotal: 200, financeCostPercent: 1.5,
  });
  const [isAddModalOpen, setIsAddModalOpen] = useState(false);
  const [newGrade, setNewGrade] = useState({ name: '', category: 'Scrap Metal', availableQty: 0, price: 0, yieldPercent: 96, elements: { ...emptyElements } });
  const [savedFlash, setSavedFlash] = useState(false);

  const persist = (next) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      setSavedFlash(true);
      setTimeout(() => setSavedFlash(false), 1200);
    } catch (e) {}
  };

  const saveNow = () => persist({ unit, materials, target, expenses });

  const weightFactor = unit === 'MT' ? 0.001 : 1;
  const priceFactor = unit === 'MT' ? 1000 : 1;
  const toDisplayWeight = (kg) => kg * weightFactor;
  const toKgWeight = (v) => v / weightFactor;
  const toDisplayPrice = (perKg) => perKg * priceFactor;
  const toKgPrice = (v) => v / priceFactor;

  const activeMaterials = materials.filter((m) => m.selected);
  const totalChargedWeightKg = activeMaterials.reduce((s, m) => s + Number(m.allocatedQtyKg || 0), 0);
  const totalRecoveredWeightKg = activeMaterials.reduce((s, m) => s + Number(m.allocatedQtyKg || 0) * ((m.yieldPercent || 100) / 100), 0);

  const calculatedComposition = ELEMENTS.reduce((acc, el) => {
    if (totalRecoveredWeightKg === 0) { acc[el] = 0; return acc; }
    const massKg = activeMaterials.reduce((s, m) => {
      const netKg = Number(m.allocatedQtyKg || 0) * ((m.yieldPercent || 100) / 100);
      return s + netKg * (m.elements[el] / 100);
    }, 0);
    acc[el] = Number(((massKg / totalRecoveredWeightKg) * 100).toFixed(2));
    return acc;
  }, {});

  const rawMaterialCostTotal = activeMaterials.reduce((s, m) => s + Number(m.allocatedQtyKg || 0) * Number(m.purchasePricePerKg || 0), 0);
  const totalDirectOverheads = Number(expenses.freightCostTotal || 0) + Number(expenses.clearanceCostTotal || 0) + Number(expenses.operationalCostTotal || 0) + Number(expenses.otherExpensesTotal || 0);
  const subtotalBeforeFinance = rawMaterialCostTotal + totalDirectOverheads;
  const financeFeeTotal = subtotalBeforeFinance * (Number(expenses.financeCostPercent || 0) / 100);
  const grandTotalExpenses = subtotalBeforeFinance + financeFeeTotal;
  const netCostPerUnit = totalRecoveredWeightKg > 0 ? grandTotalExpenses / totalRecoveredWeightKg / weightFactor : 0;
  const totalGrossRevenue = totalRecoveredWeightKg * Number(target.targetSalesPricePerKg || 0);
  const netGrossProfit = totalGrossRevenue - grandTotalExpenses;
  const grossMarginPercent = totalGrossRevenue > 0 ? (netGrossProfit / totalGrossRevenue) * 100 : 0;
  const weightVsTargetPercent = target.targetWeightKg > 0 ? (totalRecoveredWeightKg / target.targetWeightKg) * 100 : 0;

  const updateMaterial = (id, key, val) => setMaterials((prev) => prev.map((m) => (m.id === id ? { ...m, [key]: val } : m)));
  const removeMaterial = (id) => setMaterials((prev) => prev.filter((m) => m.id !== id));

  const handleAddNewGradeSubmit = (e) => {
    e.preventDefault();
    if (!newGrade.name.trim()) return;
    const created = {
      id: `mat-${Date.now()}`, name: newGrade.name.trim(), category: newGrade.category,
      availableQtyKg: toKgWeight(Number(newGrade.availableQty) || 0), purchasePricePerKg: toKgPrice(Number(newGrade.price) || 0),
      yieldPercent: Number(newGrade.yieldPercent) || 0, elements: newGrade.elements, selected: true, allocatedQtyKg: 0,
    };
    setMaterials((prev) => [...prev, created]);
    setIsAddModalOpen(false);
    setNewGrade({ name: '', category: 'Scrap Metal', availableQty: 0, price: 0, yieldPercent: 96, elements: { ...emptyElements } });
  };

  return (
    <div className="page-pad" style={styles.page}>
      <div className="header-row" style={styles.header}>
        <div style={styles.brandRow}>
          <div style={styles.brandMark}><CalculatorIcon size={20} color="#14140F" /></div>
          <div>
            <h1 style={styles.title}>Alloy Blend &amp; Charge Costing</h1>
            <p style={styles.subtitle}>Inventory, yield-adjusted chemistry, and margin against contract spec.</p>
          </div>
        </div>
        <div className="header-controls" style={styles.headerControls}>
          <div style={styles.unitToggle}>
            <button onClick={() => setUnit('MT')} style={{ ...styles.unitBtn, ...(unit === 'MT' ? styles.unitBtnActive : {}) }}><ScaleIcon size={13} /> MT</button>
            <button onClick={() => setUnit('kg')} style={{ ...styles.unitBtn, ...(unit === 'kg' ? styles.unitBtnActive : {}) }}><ScaleIcon size={13} /> kg</button>
          </div>
          <button onClick={saveNow} style={styles.saveBtn}>{savedFlash ? 'Saved' : 'Save'}</button>
          <button onClick={() => setIsAddModalOpen(true)} style={styles.addBtn}><PlusIcon size={15} /> Add grade</button>
        </div>
      </div>

      <div className="kpi-grid" style={styles.kpiGrid}>
        <div style={styles.kpiCard}>
          <div style={styles.kpiLabel}><PackageIcon size={13} /> Recovered output</div>
          <div style={styles.kpiValue}>{fmt(toDisplayWeight(totalRecoveredWeightKg))} <span style={styles.kpiUnit}>{unit}</span></div>
          <div style={styles.kpiSub}>Charged {fmt(toDisplayWeight(totalChargedWeightKg))} {unit} · {fmt(weightVsTargetPercent, { maximumFractionDigits: 0 })}% of target</div>
        </div>
        <div style={styles.kpiCard}>
          <div style={styles.kpiLabel}><DollarIcon size={13} /> Net cost / {unit}</div>
          <div style={{ ...styles.kpiValue, color: '#D98A4A' }}>${fmt(netCostPerUnit)}</div>
          <div style={styles.kpiSub}>Total expenses ${fmt(grandTotalExpenses)}</div>
        </div>
        <div style={styles.kpiCard}>
          <div style={styles.kpiLabel}><TrendingUpIcon size={13} /> Gross revenue</div>
          <div style={{ ...styles.kpiValue, color: '#8FB89A' }}>${fmt(totalGrossRevenue)}</div>
          <div style={styles.kpiSub}>At ${fmt(toDisplayPrice(target.targetSalesPricePerKg))}/{unit} contract price</div>
        </div>
        <div style={{ ...styles.kpiCard, borderColor: netGrossProfit >= 0 ? '#3E5B45' : '#6E3A2E', background: netGrossProfit >= 0 ? 'rgba(111,158,120,0.06)' : 'rgba(181,83,61,0.08)' }}>
          <div style={styles.kpiLabel}><PercentIcon size={13} /> Gross profit &amp; margin</div>
          <div style={{ ...styles.kpiValue, color: netGrossProfit >= 0 ? '#8FB89A' : '#D08267' }}>${fmt(netGrossProfit)}</div>
          <div style={{ ...styles.kpiSub, color: netGrossProfit >= 0 ? '#8FB89A' : '#D08267' }}>Margin {fmt(grossMarginPercent)}%</div>
        </div>
      </div>

      <div className="main-grid" style={styles.mainGrid}>
        <div style={styles.leftCol}>
          <section style={styles.panel}>
            <div style={styles.panelHeader}><LayersIcon size={16} color="#C4622D" /><h2 style={styles.panelTitle}>Stock inventory &amp; charge allocation</h2></div>
            <div style={{ overflowX: 'auto' }}>
              <table style={styles.table}>
                <thead><tr style={styles.theadRow}>
                  <th style={{ ...styles.th, width: 34 }}></th>
                  <th style={styles.th}>Material</th>
                  <th style={styles.th}>Available ({unit})</th>
                  <th style={styles.th}>Price ($/{unit})</th>
                  <th style={styles.th}>Yield %</th>
                  <th style={styles.th}>Charge ({unit})</th>
                  <th style={{ ...styles.th, width: 34 }}></th>
                </tr></thead>
                <tbody>
                  {materials.map((mat) => (
                    <tr key={mat.id} style={mat.selected ? styles.tr : { ...styles.tr, opacity: 0.4 }}>
                      <td style={styles.td}><input type="checkbox" checked={mat.selected} onChange={(e) => updateMaterial(mat.id, 'selected', e.target.checked)} style={{ width: 15, height: 15, accentColor: '#C4622D' }} /></td>
                      <td style={styles.td}><div style={styles.matName}>{mat.name}</div><div style={styles.matCategory}>{mat.category}</div></td>
                      <td style={styles.td}><input type="number" value={Number(toDisplayWeight(mat.availableQtyKg).toFixed(2))} onChange={(e) => updateMaterial(mat.id, 'availableQtyKg', toKgWeight(parseFloat(e.target.value) || 0))} style={styles.numInput} /></td>
                      <td style={styles.td}><input type="number" step="0.01" value={Number(toDisplayPrice(mat.purchasePricePerKg).toFixed(2))} onChange={(e) => updateMaterial(mat.id, 'purchasePricePerKg', toKgPrice(parseFloat(e.target.value) || 0))} style={{ ...styles.numInput, color: '#D98A4A' }} /></td>
                      <td style={styles.td}><input type="number" step="0.1" value={mat.yieldPercent} onChange={(e) => updateMaterial(mat.id, 'yieldPercent', parseFloat(e.target.value) || 0)} style={{ ...styles.numInput, width: 60 }} /></td>
                      <td style={styles.td}><input type="number" disabled={!mat.selected} value={Number(toDisplayWeight(mat.allocatedQtyKg).toFixed(2))} onChange={(e) => updateMaterial(mat.id, 'allocatedQtyKg', toKgWeight(parseFloat(e.target.value) || 0))} style={styles.chargeInput} /></td>
                      <td style={styles.td}><button onClick={() => removeMaterial(mat.id)} style={styles.iconBtn} title="Remove grade"><TrashIcon size={14} /></button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>

          <section style={styles.panel}>
            <div style={styles.panelHeader}><RefreshIcon size={16} color="#8FB89A" /><h2 style={styles.panelTitle}>Blended chemistry vs. contract spec</h2></div>
            <div style={styles.chemGrid}>
              {ELEMENTS.map((el) => {
                const actual = calculatedComposition[el];
                const min = target.minSpecs[el], max = target.maxSpecs[el];
                const compliant = actual >= min && actual <= max;
                return (
                  <div key={el} style={{ ...styles.chemCard, borderColor: compliant ? '#33312A' : '#6E3A2E', background: compliant ? '#1E1D18' : 'rgba(181,83,61,0.08)' }}>
                    <div style={styles.chemTop}><span style={styles.chemSymbol}>{el}</span>{compliant ? <CheckIcon size={15} color="#8FB89A" /> : <AlertIcon size={15} color="#D08267" />}</div>
                    <div style={styles.chemValue}>{actual}%</div>
                    <div style={styles.chemRange}>Spec {min}–{max}%</div>
                  </div>
                );
              })}
            </div>
          </section>
        </div>

        <div style={styles.rightCol}>
          <section style={styles.panel}>
            <div style={styles.panelHeader}><FileCheckIcon size={16} color="#D98A4A" /><h2 style={styles.panelTitle}>Customer contract</h2></div>
            <div style={styles.formStack}>
              <label style={styles.fieldLabel}>Grade / specification name
                <input type="text" value={target.gradeName} onChange={(e) => setTarget((p) => ({ ...p, gradeName: e.target.value }))} style={styles.textInput} />
              </label>
              <label style={styles.fieldLabel}>Target output weight ({unit})
                <input type="number" value={Number(toDisplayWeight(target.targetWeightKg).toFixed(2))} onChange={(e) => setTarget((p) => ({ ...p, targetWeightKg: toKgWeight(parseFloat(e.target.value) || 0) }))} style={styles.textInput} />
              </label>
              <label style={styles.fieldLabel}>Contract sales price ($/{unit})
                <input type="number" step="0.01" value={Number(toDisplayPrice(target.targetSalesPricePerKg).toFixed(2))} onChange={(e) => setTarget((p) => ({ ...p, targetSalesPricePerKg: toKgPrice(parseFloat(e.target.value) || 0) }))} style={{ ...styles.textInput, color: '#8FB89A', fontWeight: 700 }} />
              </label>
              <div style={styles.specTableWrap}>
                <div style={styles.specTableTitle}>Min / max spec limits (%)</div>
                <table style={styles.specTable}>
                  <thead><tr><th style={styles.specTh}>El.</th><th style={styles.specTh}>Min</th><th style={styles.specTh}>Max</th></tr></thead>
                  <tbody>
                    {ELEMENTS.map((el) => (
                      <tr key={el}>
                        <td style={styles.specTdLabel}>{el}</td>
                        <td style={styles.specTd}><input type="number" step="0.1" value={target.minSpecs[el]} onChange={(e) => setTarget((p) => ({ ...p, minSpecs: { ...p.minSpecs, [el]: parseFloat(e.target.value) || 0 } }))} style={styles.specInput} /></td>
                        <td style={styles.specTd}><input type="number" step="0.1" value={target.maxSpecs[el]} onChange={(e) => setTarget((p) => ({ ...p, maxSpecs: { ...p.maxSpecs, [el]: parseFloat(e.target.value) || 0 } }))} style={styles.specInput} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <section style={styles.panel}>
            <div style={styles.panelHeader}><ReceiptIcon size={16} color="#9AA0A6" /><h2 style={styles.panelTitle}>Overhead &amp; finance costs</h2></div>
            <div style={styles.formStack}>
              <label style={styles.fieldLabel}>Freight, total ($)<input type="number" value={expenses.freightCostTotal} onChange={(e) => setExpenses((p) => ({ ...p, freightCostTotal: parseFloat(e.target.value) || 0 }))} style={styles.textInput} /></label>
              <label style={styles.fieldLabel}>Customs clearance, total ($)<input type="number" value={expenses.clearanceCostTotal} onChange={(e) => setExpenses((p) => ({ ...p, clearanceCostTotal: parseFloat(e.target.value) || 0 }))} style={styles.textInput} /></label>
              <label style={styles.fieldLabel}>Operational cost, total ($)<input type="number" value={expenses.operationalCostTotal} onChange={(e) => setExpenses((p) => ({ ...p, operationalCostTotal: parseFloat(e.target.value) || 0 }))} style={styles.textInput} /></label>
              <label style={styles.fieldLabel}>Other expenses, total ($)<input type="number" value={expenses.otherExpensesTotal} onChange={(e) => setExpenses((p) => ({ ...p, otherExpensesTotal: parseFloat(e.target.value) || 0 }))} style={styles.textInput} /></label>
              <label style={styles.fieldLabel}>Finance cost (%)<input type="number" step="0.1" value={expenses.financeCostPercent} onChange={(e) => setExpenses((p) => ({ ...p, financeCostPercent: parseFloat(e.target.value) || 0 }))} style={styles.textInput} /></label>
              <div style={styles.divider} />
              <div style={styles.expenseRow}><span>Raw material cost</span><span>${fmt(rawMaterialCostTotal)}</span></div>
              <div style={styles.expenseRow}><span>Direct overheads</span><span>${fmt(totalDirectOverheads)}</span></div>
              <div style={styles.expenseRow}><span>Finance fee</span><span>${fmt(financeFeeTotal)}</span></div>
              <div style={{ ...styles.expenseRow, ...styles.expenseTotalRow }}><span>Total expenses</span><span>${fmt(grandTotalExpenses)}</span></div>
            </div>
          </section>
        </div>
      </div>

      {isAddModalOpen && (
        <div style={styles.modalOverlay} onClick={() => setIsAddModalOpen(false)}>
          <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}><h3 style={styles.modalTitle}>Add material grade</h3><button onClick={() => setIsAddModalOpen(false)} style={styles.iconBtn}><XIcon size={16} /></button></div>
            <form onSubmit={handleAddNewGradeSubmit} style={styles.formStack}>
              <label style={styles.fieldLabel}>Grade name<input type="text" required value={newGrade.name} onChange={(e) => setNewGrade((p) => ({ ...p, name: e.target.value }))} style={styles.textInput} placeholder="e.g. Monel 400 turnings" /></label>
              <label style={styles.fieldLabel}>Category<input type="text" value={newGrade.category} onChange={(e) => setNewGrade((p) => ({ ...p, category: e.target.value }))} style={styles.textInput} /></label>
              <div style={styles.twoCol}>
                <label style={styles.fieldLabel}>Available ({unit})<input type="number" value={newGrade.availableQty} onChange={(e) => setNewGrade((p) => ({ ...p, availableQty: parseFloat(e.target.value) || 0 }))} style={styles.textInput} /></label>
                <label style={styles.fieldLabel}>Price ($/{unit})<input type="number" step="0.01" value={newGrade.price} onChange={(e) => setNewGrade((p) => ({ ...p, price: parseFloat(e.target.value) || 0 }))} style={styles.textInput} /></label>
              </div>
              <label style={styles.fieldLabel}>Yield %<input type="number" step="0.1" value={newGrade.yieldPercent} onChange={(e) => setNewGrade((p) => ({ ...p, yieldPercent: parseFloat(e.target.value) || 0 }))} style={styles.textInput} /></label>
              <div style={styles.specTableTitle}>Elemental composition (%)</div>
              <div style={styles.elementGrid}>
                {ELEMENTS.map((el) => (
                  <label key={el} style={styles.elementField}>{el}
                    <input type="number" step="0.1" value={newGrade.elements[el]} onChange={(e) => setNewGrade((p) => ({ ...p, elements: { ...p.elements, [el]: parseFloat(e.target.value) || 0 } }))} style={styles.specInput} />
                  </label>
                ))}
              </div>
              <button type="submit" style={styles.submitBtn}>Add to inventory</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}
